<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ScholarLink - Sign In</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --burgundy: #800020;
            --dark-burgundy: #5c0018;
            --dark: #222222;
            --grey: #666666;
            --border: #dddddd;
        }


        body {

            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(30, 5, 15, 0.45),
                    rgba(30, 5, 15, 0.45)
                ),
                url("Scholarlink-background.png");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;
        }


        /*LOGIN CARD*/

        .login-container {

            width: 430px;

            max-width: 100%;

            background: white;

            padding: 40px;

            border-radius: 14px;

            border-top: 6px solid var(--burgundy);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }


        /*LOGO*/

        .logo {

            text-align: center;

            color: var(--burgundy);

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: var(--grey);

            font-size: 15px;

            margin-bottom: 30px;
        }


       
        .message {

            display: none;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 6px;

            text-align: center;

            font-size: 14px;
        }


        .message.error {

            display: block;

            background: #fbeaea;

            border: 1px solid #edc5cc;

            color: #a00020;
        }


        .message.success {

            display: block;

            background: #eaf7ee;

            border: 1px solid #bfe2ca;

            color: #176b35;
        }


        

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;

            color: var(--dark);
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);

            border-radius: 7px;

            font-size: 14px;

            color: #222222;

            background: white;
        }


        input:focus {

            outline: none;

            border-color: var(--burgundy);

            box-shadow:
                0 0 0 3px rgba(128, 0, 32, 0.08);
        }


       

        .password-wrapper {

            position: relative;
        }


        .password-wrapper input {

            padding-right: 75px;
        }


        .show-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: var(--burgundy);

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }


        /*LOGIN BUTTON*/

        .login-button {

            width: 100%;

            padding: 13px;

            background: var(--burgundy);

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .login-button:hover {

            background: var(--dark-burgundy);

            transform: translateY(-1px);
        }


        .login-button:disabled {

            background: #999999;

            cursor: not-allowed;

            transform: none;
        }


        
        .signup-link {

            text-align: center;

            margin-top: 22px;

            color: var(--grey);

            font-size: 14px;
        }


        .signup-link a {

            color: var(--burgundy);

            font-weight: 700;

            text-decoration: none;
        }


        .signup-link a:hover {

            text-decoration: underline;
        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #777777;

            font-size: 13px;

            text-decoration: none;
        }


        .back-home:hover {

            color: var(--burgundy);
        }


        

        @media (max-width: 500px) {

            body {

                padding: 20px 15px;
            }


            .login-container {

                padding: 30px 22px;
            }


            .logo {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>


    <div class="login-container">


       

        <div class="logo">

            🎓 ScholarLink

        </div>


        <div class="subtitle">

            Sign in to your account

        </div>


       
        <div id="message" class="message"></div>


        

        <form id="loginForm">


            

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


           

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            
            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                Sign In

            </button>


        </form>


       
        <div class="signup-link">

            Don't have an account?

            <a href="signup.html">

                Create an account

            </a>

        </div>


       

        <a
            href="index.html"
            class="back-home"
        >

            ← Back to ScholarLink

        </a>


    </div>



    

    <script>

    /*SHOW and HIDE PASSWORD*/

    document
        .getElementById("showPassword")
        .addEventListener("click", function() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";
                this.textContent = "Hide";

            } else {

                password.type = "password";
                this.textContent = "Show";

            }

        });


    /*LOGIN */

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document.getElementById("message");


            const loginButton =
                document.getElementById("loginButton");


            /*VALIDATION*/

            if (!email || !password) {

                message.className =
                    "message error";

                message.textContent =
                    "Please enter your email and password.";

                return;

            }


            /*DISABLE BUTTON */

            loginButton.disabled = true;

            loginButton.textContent =
                "Signing In...";


            message.className =
                "message success";

            message.textContent =
                "Signing you in...";


            try {

                /* SENDing LOGIN TO SCHOLARLINK BACKEND*/

                const response =
                    await fetch(
                        "http://localhost:3000/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                /* GETTING SERVER RESPONSE */

                const result =
                    await response.json();


                /* IF LOGGING IN FAILED */

                if (!response.ok || !result.success) {

                    message.className =
                        "message error";

                    message.textContent =
                        result.message ||
                        "Incorrect email or password.";

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Sign In";

                    return;

                }


                /*SAVE CURRENT USER*/

                sessionStorage.setItem(
                    "scholarLinkLoggedIn",
                    "true"
                );


                sessionStorage.setItem(
                    "scholarLinkCurrentUser",
                    JSON.stringify(result.user)
                );


                /*SUCCESS */

                message.className =
                    "message success";

                message.textContent =
                    "Sign in successful! Redirecting...";


                loginButton.textContent =
                    "Signed In";


                /*GO TO APPLICANT DASHBOARD */

                setTimeout(function() {

                    window.location.href =
                        "applicant-dashboard.html";

                }, 800);


            } catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                message.className =
                    "message error";

                message.textContent =
                    "Unable to connect to the ScholarLink server. Please make sure the backend is running.";


                loginButton.disabled = false;

                loginButton.textContent =
                    "Sign In";

            }

        });

</script>
</body>

</html>
